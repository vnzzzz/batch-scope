components:
  schemas:
    AnalysisCycle:
      additionalProperties: false
      properties:
        containsImplicitRelation:
          type: boolean
        containsUncertainRelation:
          type: boolean
        cycleId:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/AnalysisNodePublic"
          type: array
        route:
          items:
            $ref: "#/components/schemas/AnalysisCycleStep"
          type: array
      required:
        - cycleId
        - nodes
        - route
        - containsImplicitRelation
        - containsUncertainRelation
      type: object
    AnalysisCycleStep:
      additionalProperties: false
      properties:
        fromId:
          type: string
        toId:
          type: string
        viaRelations:
          items:
            $ref: "#/components/schemas/AnalysisRelation"
          type: array
        viaScope:
          type: boolean
      required:
        - fromId
        - toId
        - viaRelations
        - viaScope
      type: object
    AnalysisEvidence:
      additionalProperties: false
      properties:
        location:
          $ref: "#/components/schemas/AnalysisEvidenceLocation"
        note:
          type: string
        source:
          type: string
      required:
        - source
      type: object
    AnalysisEvidenceLocation:
      additionalProperties: false
      properties:
        endLine:
          minimum: 1
          type: integer
        jsonPointer:
          type: string
        startLine:
          minimum: 1
          type: integer
      type: object
    AnalysisFinishByFact:
      additionalProperties: false
      properties:
        businessDayOffset:
          format: int64
          type: integer
        certainty:
          enum:
            - declared
            - confirmed
            - inferred
            - candidate
          type: string
        id:
          type: string
        kind:
          enum:
            - finish_by
          type: string
        localTime:
          type: string
        origin:
          enum:
            - scheduler
            - deterministic_analysis
            - ai_analysis
            - manual
          type: string
        sourceText:
          type: string
        timeZone:
          type: string
      required:
        - id
        - kind
        - businessDayOffset
        - localTime
        - timeZone
        - origin
        - certainty
      type: object
    AnalysisFinishByGroup:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AnalysisLimitItem"
          type: array
        timeZone:
          type: string
        total:
          format: int64
          type: integer
      required:
        - timeZone
        - total
        - items
      type: object
    AnalysisHiddenConnection:
      additionalProperties: false
      properties:
        fromId:
          type: string
        fromIdentity:
          $ref: "#/components/schemas/AnalysisIdentityRef"
        toId:
          type: string
        toIdentity:
          $ref: "#/components/schemas/AnalysisIdentityRef"
        viaRelations:
          items:
            $ref: "#/components/schemas/AnalysisRelation"
          type: array
        viaScope:
          type: boolean
      required:
        - fromId
        - fromIdentity
        - toId
        - toIdentity
        - viaRelations
        - viaScope
      type: object
    AnalysisIdentityRef:
      additionalProperties: false
      properties:
        localId:
          type: string
        namespace:
          type: string
      required:
        - namespace
        - localId
      type: object
    AnalysisLimitGroup:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AnalysisLimitItem"
          type: array
        total:
          format: int64
          type: integer
      required:
        - total
        - items
      type: object
    AnalysisLimitItem:
      additionalProperties: false
      properties:
        alternatePathCount:
          format: int64
          type: integer
        fact:
          discriminator:
            mapping:
              finish_by: "#/components/schemas/AnalysisFinishByFact"
              max_elapsed: "#/components/schemas/AnalysisMaxElapsedFact"
              raw: "#/components/schemas/AnalysisRawFact"
            propertyName: kind
          oneOf:
            - $ref: "#/components/schemas/AnalysisFinishByFact"
            - $ref: "#/components/schemas/AnalysisMaxElapsedFact"
            - $ref: "#/components/schemas/AnalysisRawFact"
        limitOwner:
          $ref: "#/components/schemas/AnalysisNodePublic"
        scopeRoot:
          $ref: "#/components/schemas/AnalysisNodePublic"
        treeNodeId:
          type: string
      required:
        - limitOwner
        - fact
        - treeNodeId
        - alternatePathCount
      type: object
    AnalysisLimitSections:
      additionalProperties: false
      properties:
        contained:
          $ref: "#/components/schemas/AnalysisLimits"
        downstream:
          $ref: "#/components/schemas/AnalysisLimits"
        target:
          $ref: "#/components/schemas/AnalysisLimits"
      required:
        - target
        - contained
        - downstream
      type: object
    AnalysisLimits:
      additionalProperties: false
      properties:
        finishByGroups:
          items:
            $ref: "#/components/schemas/AnalysisFinishByGroup"
          type: array
        maxElapsed:
          $ref: "#/components/schemas/AnalysisLimitGroup"
        raw:
          $ref: "#/components/schemas/AnalysisLimitGroup"
      required:
        - finishByGroups
        - maxElapsed
        - raw
      type: object
    AnalysisMaxElapsedFact:
      additionalProperties: false
      properties:
        certainty:
          enum:
            - declared
            - confirmed
            - inferred
            - candidate
          type: string
        duration:
          type: string
        id:
          type: string
        kind:
          enum:
            - max_elapsed
          type: string
        origin:
          enum:
            - scheduler
            - deterministic_analysis
            - ai_analysis
            - manual
          type: string
        sourceText:
          type: string
      required:
        - id
        - kind
        - duration
        - origin
        - certainty
      type: object
    AnalysisNodePublic:
      additionalProperties: false
      properties:
        id:
          type: string
        localId:
          type: string
        name:
          type: string
        namespace:
          type: string
        type:
          enum:
            - management_unit
            - job_network
            - job
            - file
            - file_pattern
            - job_status
            - external_event
          type: string
      required:
        - id
        - namespace
        - localId
        - type
        - name
      type: object
    AnalysisRawFact:
      additionalProperties: false
      properties:
        certainty:
          enum:
            - declared
            - confirmed
            - inferred
            - candidate
          type: string
        id:
          type: string
        kind:
          enum:
            - raw
          type: string
        origin:
          enum:
            - scheduler
            - deterministic_analysis
            - ai_analysis
            - manual
          type: string
        sourceText:
          type: string
      required:
        - id
        - kind
        - sourceText
        - origin
        - certainty
      type: object
    AnalysisRelation:
      additionalProperties: false
      properties:
        certainty:
          enum:
            - declared
            - confirmed
            - inferred
            - candidate
          type: string
        evidence:
          items:
            $ref: "#/components/schemas/AnalysisEvidence"
          type: array
        kind:
          enum:
            - precedes
            - produces
            - triggers
            - consumed_by
            - observed_by
          type: string
        origin:
          enum:
            - scheduler
            - deterministic_analysis
            - ai_analysis
            - manual
          type: string
      required:
        - kind
        - origin
        - certainty
      type: object
    AnalysisResponse:
      additionalProperties: false
      properties:
        bootId:
          type: string
        cycles:
          items:
            $ref: "#/components/schemas/AnalysisCycle"
          type: array
        limits:
          $ref: "#/components/schemas/AnalysisLimitSections"
        snapshotId:
          type: string
        target:
          $ref: "#/components/schemas/Details"
        tree:
          $ref: "#/components/schemas/AnalysisTreeNode"
        uncoveredRoutes:
          items:
            $ref: "#/components/schemas/AnalysisUncoveredRoute"
          type: array
      required:
        - bootId
        - snapshotId
        - target
        - limits
        - tree
        - uncoveredRoutes
        - cycles
      type: object
    AnalysisTreeNode:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/AnalysisTreeNode"
          type: array
        cycleId:
          type: string
        hiddenConnections:
          items:
            $ref: "#/components/schemas/AnalysisHiddenConnection"
          type: array
        hiddenJobCount:
          format: int64
          type: integer
        hiddenNodeIds:
          items:
            type: string
          type: array
        hiddenNodeIdsTruncated:
          type: boolean
        node:
          $ref: "#/components/schemas/AnalysisNodePublic"
        referenceTo:
          type: string
        referenceType:
          enum:
            - shared
            - cycle
          type: string
        treeNodeId:
          type: string
        viaRelations:
          items:
            $ref: "#/components/schemas/AnalysisRelation"
          type: array
        viaScope:
          type: boolean
      required:
        - treeNodeId
        - node
        - children
      type: object
    AnalysisUncoveredRoute:
      additionalProperties: false
      properties:
        boundary:
          $ref: "#/components/schemas/AnalysisNodePublic"
        cycleId:
          type: string
        reason:
          enum:
            - terminal_without_limit
            - cycle_without_limit
            - non_traversable_node_type
          type: string
        treeNodeId:
          type: string
      required:
        - boundary
        - reason
        - treeNodeId
      type: object
    Ancestor:
      additionalProperties: false
      properties:
        id:
          type: string
        localId:
          type: string
        name:
          type: string
        namespace:
          type: string
        type:
          enum:
            - management_unit
            - job_network
          type: string
      required:
        - id
        - namespace
        - localId
        - type
        - name
      type: object
    BuildInfo:
      additionalProperties: false
      properties:
        commit:
          type: string
        version:
          type: string
      required:
        - version
        - commit
      type: object
    Details:
      additionalProperties: false
      properties:
        ancestorPath:
          items:
            $ref: "#/components/schemas/Ancestor"
          type: array
        id:
          type: string
        localId:
          type: string
        name:
          type: string
        namespace:
          type: string
        path:
          type: string
        type:
          enum:
            - job
            - job_network
          type: string
      required:
        - ancestorPath
        - id
        - namespace
        - localId
        - type
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    ImportFailure:
      additionalProperties: false
      properties:
        detail:
          type: string
        file:
          type: string
        line:
          format: int64
          type: integer
        pointer:
          type: string
        reason:
          type: string
        status:
          format: int64
          type: integer
        type:
          type: string
      required:
        - type
        - status
        - detail
      type: object
    ImportResource:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        error:
          $ref: "#/components/schemas/ImportFailure"
        importId:
          type: string
        snapshotId:
          type: string
        state:
          enum:
            - accepted
            - validating
            - building
            - activating
            - succeeded
            - failed
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - importId
        - state
        - createdAt
        - updatedAt
      type: object
    ReadyResponse:
      additionalProperties: false
      properties:
        reason:
          type: string
        status:
          type: string
      required:
        - status
        - reason
      type: object
    SearchItem:
      additionalProperties: false
      properties:
        ancestorPath:
          items:
            $ref: "#/components/schemas/Ancestor"
          type: array
        id:
          type: string
        localId:
          type: string
        matchedBy:
          items:
            enum:
              - id
              - localId
              - name
              - path
            type: string
          type: array
        name:
          type: string
        namespace:
          type: string
        path:
          type: string
        type:
          enum:
            - job
            - job_network
          type: string
      required:
        - matchedBy
        - ancestorPath
        - id
        - namespace
        - localId
        - type
        - name
      type: object
    SnapshotInfo:
      additionalProperties: false
      properties:
        generatedAt:
          format: date-time
          type: string
        limitCount:
          format: int64
          type: integer
        nodeCount:
          format: int64
          type: integer
        relationCount:
          format: int64
          type: integer
        schemaVersion:
          type: string
        snapshotId:
          type: string
      required:
        - snapshotId
        - generatedAt
        - schemaVersion
        - nodeCount
        - relationCount
        - limitCount
      type: object
    StatusResponse:
      additionalProperties: false
      properties:
        bootId:
          type: string
        build:
          $ref: "#/components/schemas/BuildInfo"
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/SnapshotInfo"
            - type: "null"
        startedAt:
          format: date-time
          type: string
        state:
          type: string
      required:
        - state
        - bootId
        - startedAt
        - snapshot
        - build
      type: object
    TargetsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SearchItem"
          type: array
        snapshotId:
          type: string
        truncated:
          type: boolean
      required:
        - snapshotId
        - items
        - truncated
      type: object
info:
  title: BatchScope API
  version: v1
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check process health
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: Service Unavailable
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check snapshot readiness
  /v1/downstream-limit-analysis:
    get:
      operationId: analyze-downstream-limits
      parameters:
        - description: Exact job or job network ID to analyze
          explode: false
          in: query
          name: targetId
          required: true
          schema:
            description: Exact job or job network ID to analyze
            maxLength: 1024
            minLength: 1
            type: string
        - description: Include relation evidence in the response
          explode: false
          in: query
          name: includeEvidence
          schema:
            default: false
            description: Include relation evidence in the response
            type: boolean
        - description: Request identifier used in structured logs
          in: header
          name: X-Request-Id
          schema:
            description: Request identifier used in structured logs
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Analyze downstream configured limits and dependency routes
  /v1/snapshot-imports:
    post:
      operationId: create-snapshot-import
      parameters:
        - description: Request identifier used in structured logs
          in: header
          name: X-Request-Id
          schema:
            type: string
      requestBody:
        content:
          application/vnd.batchscope.snapshot+gzip:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Upload a snapshot and start an asynchronous import
  /v1/snapshot-imports/{importId}:
    get:
      operationId: get-snapshot-import
      parameters:
        - description: Snapshot import identifier
          in: path
          name: importId
          required: true
          schema:
            description: Snapshot import identifier
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResource"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get snapshot import status
  /v1/snapshots/current:
    get:
      operationId: get-current-snapshot
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotInfo"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Get the current searchable snapshot
  /v1/status:
    get:
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get service status
  /v1/targets:
    get:
      operationId: search-targets
      parameters:
        - description: Legacy exact canonical ID, name, or full path search; use jobId for namespace-aware job ID search
          explode: false
          in: query
          name: query
          schema:
            description: Legacy exact canonical ID, name, or full path search; use jobId for namespace-aware job ID search
            type: string
        - description: Exact source-local job or job network ID
          explode: false
          in: query
          name: jobId
          schema:
            description: Exact source-local job or job network ID
            type: string
        - description: Optional semantic definition-set namespace used with jobId
          explode: false
          in: query
          name: namespace
          schema:
            description: Optional semantic definition-set namespace used with jobId
            type: string
        - description: Target type filter; may be repeated
          explode: true
          in: query
          name: type
          schema:
            description: Target type filter; may be repeated
            items:
              enum:
                - job
                - job_network
              type: string
            type:
              - array
              - "null"
        - description: Request identifier used in structured logs
          in: header
          name: X-Request-Id
          schema:
            description: Request identifier used in structured logs
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Search jobs and job networks by local job ID or legacy exact match
