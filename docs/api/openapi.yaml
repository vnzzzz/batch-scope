components:
  schemas:
    Ancestor:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
      required:
        - id
        - type
        - name
      type: object
    BuildInfo:
      additionalProperties: false
      properties:
        commit:
          type: string
        version:
          type: string
      required:
        - version
        - commit
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    ReadyResponse:
      additionalProperties: false
      properties:
        reason:
          type: string
        status:
          type: string
      required:
        - status
        - reason
      type: object
    SearchItem:
      additionalProperties: false
      properties:
        ancestorPath:
          items:
            $ref: "#/components/schemas/Ancestor"
          type: array
        id:
          type: string
        matchedBy:
          items:
            enum:
              - id
              - name
              - path
            type: string
          type: array
        name:
          type: string
        path:
          type: string
        type:
          enum:
            - job
            - job_network
          type: string
      required:
        - matchedBy
        - ancestorPath
        - id
        - type
        - name
      type: object
    StatusResponse:
      additionalProperties: false
      properties:
        bootId:
          type: string
        build:
          $ref: "#/components/schemas/BuildInfo"
        snapshot: {}
        startedAt:
          format: date-time
          type: string
        state:
          type: string
      required:
        - state
        - bootId
        - startedAt
        - snapshot
        - build
      type: object
    TargetsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SearchItem"
          type: array
        snapshotId:
          type: string
        truncated:
          type: boolean
      required:
        - snapshotId
        - items
        - truncated
      type: object
info:
  title: BatchScope API
  version: v1
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check process health
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: Service Unavailable
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check snapshot readiness
  /v1/status:
    get:
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get service status
  /v1/targets:
    get:
      operationId: search-targets
      parameters:
        - description: Exact ID, name, or full path to search for
          explode: false
          in: query
          name: query
          required: true
          schema:
            description: Exact ID, name, or full path to search for
            type: string
        - description: Target type filter; may be repeated
          explode: true
          in: query
          name: type
          schema:
            description: Target type filter; may be repeated
            items:
              enum:
                - job
                - job_network
              type: string
            type:
              - array
              - "null"
        - description: Request identifier used in structured logs
          in: header
          name: X-Request-Id
          schema:
            description: Request identifier used in structured logs
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Search jobs and job networks by exact match
