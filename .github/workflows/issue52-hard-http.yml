name: Issue 52 hard HTTP measurement

on:
  push:
    branches:
      - feature/support-400k-snapshots

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/support-400k-snapshots
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Make root target primary only in measurement workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/testsupport/graphgen/operational.go')
          text = path.read_text()
          representative = '''\t\tExpectations: []Expectation{\n\t\t\t{\n\t\t\t\tInputNodeCount: nodeCount, InputRelationCount: relationCount, InputLimitCount: limitCount,\n\t\t\t\tTargetID: representativeTarget,\n\t\t\t},\n\t\t\t{\n\t\t\t\tInputNodeCount: nodeCount, InputRelationCount: relationCount, InputLimitCount: limitCount,\n\t\t\t\tTargetID: rootID,\n\t\t\t},\n\t\t},'''
          worst = '''\t\tExpectations: []Expectation{\n\t\t\t{\n\t\t\t\tInputNodeCount: nodeCount, InputRelationCount: relationCount, InputLimitCount: limitCount,\n\t\t\t\tTargetID: rootID,\n\t\t\t},\n\t\t\t{\n\t\t\t\tInputNodeCount: nodeCount, InputRelationCount: relationCount, InputLimitCount: limitCount,\n\t\t\t\tTargetID: representativeTarget,\n\t\t\t},\n\t\t},'''
          if text.count(representative) != 1:
              raise SystemExit('target-order block not found')
          path.write_text(text.replace(representative, worst, 1))
          PY
          gofmt -w internal/testsupport/graphgen/operational.go
      - name: Measure full 400k HTTP response
        shell: bash
        run: |
          set -Eeuo pipefail
          go run ./cmd/perf-measure -mode limit-analysis -profile operational -runs 2 -concurrencies 1 > /tmp/hard-http.json
          jq '{environment, datasets: [.datasets[] | {name, nodes, relations, target}]}' /tmp/hard-http.json
