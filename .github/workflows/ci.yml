name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify
        run: make verify

      - name: Build production image
        run: make image TAG=ci

  plugin-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install agent CLIs
        run: |
          npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.227
          codex --version
          claude --version

      - name: Install shared Plugin from agent-skills PR branch
        env:
          AGENT_SKILLS_MARKETPLACE_REF: agent/issue-9-dual-plugin
        run: bash scripts/install-shared-plugin.sh

      - name: Verify Plugin bootstrap is idempotent
        env:
          AGENT_SKILLS_MARKETPLACE_REF: agent/issue-9-dual-plugin
        run: bash scripts/install-shared-plugin.sh
