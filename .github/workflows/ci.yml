name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Measure operational scale
        shell: bash
        run: |
          set -Eeuo pipefail
          go run ./cmd/perf-measure -profile operational -runs 2 > /tmp/operational.json
          jq '{
            environment,
            datasets: [.datasets[] | {
              input,
              import: .import.summary,
              searches: [.searches[] | {
                target_id,
                cache_state,
                summary
              }]
            }]
          }' /tmp/operational.json

      - name: Measure representative HTTP analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          go run ./cmd/perf-measure -mode limit-analysis -profile operational -runs 2 -concurrencies 1,4 > /tmp/operational-http.json
          jq '{
            environment,
            datasets: [.datasets[] | {
              name,
              nodes,
              relations,
              target
            }]
          }' /tmp/operational-http.json

      - name: Verify
        run: make verify

      - name: Build production image
        run: make image TAG=ci
