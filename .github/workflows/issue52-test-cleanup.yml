name: Issue 52 test cleanup

on:
  push:
    branches:
      - feature/support-400k-snapshots

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue52-test-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/support-400k-snapshots
          persist-credentials: true
      - name: Remove duplicate scale regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('internal/importer/scale_pipeline_test.go')
          text = path.read_text()
          pattern = r'\nfunc TestRegressionScalePipelineCompletes\(t \*testing\.T\) \{.*?\n\}\n\nfunc TestSCCCapacityBoundaryPipeline'
          replacement = '\nfunc TestSCCCapacityBoundaryPipeline'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'match count = {count}')
          path.write_text(text)
          PY
          gofmt -w internal/importer/scale_pipeline_test.go
          go test ./internal/importer
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/importer/scale_pipeline_test.go
          git commit -m "test: keep operational scale outside normal suite [issue52-test-cleanup]"
          git push origin HEAD:feature/support-400k-snapshots
