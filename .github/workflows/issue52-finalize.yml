name: Issue 52 final documentation

on:
  push:
    branches:
      - feature/support-400k-snapshots

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue52-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/support-400k-snapshots
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Finalize code and source-of-truth docs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex match count = {count}: {pattern[:80]!r}')
              p.write_text(updated)

          # Remove path counters that became write-only after prefix arrays were removed.
          replace_once('internal/pathtree/pathtree.go', '\thopCount           int\n\trelationIDCount    int\n', '')
          replace_once('internal/pathtree/pathtree.go', '\t\thopCount:           parent.hopCount + 1,\n\t\trelationIDCount:    parent.relationIDCount,\n', '')
          replace_once('internal/pathtree/pathtree.go', '\t\tcandidate.relationIDCount += len(edge.relations)\n', '')

          operations_scale = '''## 初期対応規模

          現在の対応規模は、実運用で確認された40万ノード級のsnapshotと、形状の異なる高密度relationデータを再測定して決めています。
          この値は形式上のJSON Schema上限ではなく、受入済みsnapshotを検索時の件数上限で打ち切らず完全解析するための製品上限です。

          | 項目 | 対応規模 |
          |---|---:|
          | ノード数 | 400,000 |
          | relation数 | 300,000 |
          | リミット設定数 | 5,000 |
          | 一つのSCCに含まれるノード数 | 3,000 |
          | ジョブネット階層の深さ | 64 |
          | 想定同時検索数 | 4 |

          400,000ノード / 300,000 relation / 5,000リミットの決定的なoperational profileでは、snapshot全体から一つのtargetで全件へ到達する場合も`Traverse -> Scan -> Build`を完遂しました。
          一方、100,000ノード / 300,000 relationの高密度形状は、ノード数が少なくても経路ツリー計算の負荷が高くなります。
          そのため対応規模は件数だけを性能SLOとはみなしません。受入条件は全件解析を保証する容量境界、性能目標は代表的な検索負荷に対する目標として分けます。

          正常な検索では、深さ、探索状態数、relation読込数、リミット件数、tree node件数による打切りを行いません。
          解析を完了できない場合は部分結果を成功として返さず、時間上限や内部エラーとして失敗させます。

          測定条件と詳細値は[性能測定結果](development/performance-measurement.md#issue-52-実運用40万ノード級の再測定)を参照してください。

          ## 初期の資源見積り

          Issue #52の再測定はGitHub ActionsのUbuntu 24.04、linux/amd64、Go 1.26.5、4 CPU（`GOMAXPROCS=4`）で行いました。
          40万ノード級のoperational profileにおける主要な測定値は次のとおりです。

          | 処理 | p95または最大値 |
          |---|---:|
          | snapshot取込全体 | 48.3 s |
          | 取込時Heap増分 | 272 MiB |
          | 取込時RSS増分 | 280 MiB |
          | SQLite | 147 MiB |
          | 一時ディスク | 174 MiB |
          | 代表targetの内部解析p95 | 2.93 ms |
          | 全40万ノード到達targetの内部解析p95 | 15.2 s |
          | 全40万ノード到達targetのcold Heap増分 | 1.47 GiB |
          | 全40万ノード到達targetのcold RSS増分 | 1.56 GiB |

          代表targetの公開HTTP測定では、並行度4のp95がcold 12.24 ms、warm 10.51 msでした。
          高密度な100,000ノード / 300,000 relation形状では、メモリ削減後の内部解析p95が約25.9 s、RSS増分が約588 MiBでした。

          初期運用では4 vCPU、BatchScopeプロセスが利用可能な4 GiB以上のメモリ、`data-dir`に6 GiB以上の空きを目安とします。
          これは取込アーカイブ500 MiB、展開後4 GiBの安全上限、世代別SQLiteと測定した検索メモリへ余裕を持たせるための運用目安であり、ホスト全体の厳密な必要量を固定する契約ではありません。

          後続リミット取得のp95 1秒は、キャッシュに乗った代表的な対象を想定する性能目標です。
          snapshot全体へ到達するような最悪形状を1秒以内に切り捨てる契約ではありません。
          受入済みsnapshotの完全解析保証を優先し、異常時の解析deadlineは60秒とします。

          '''
          regex_once(
              'docs/operations.md',
              r'## 初期対応規模\n.*?## ログ\n',
              operations_scale + '## ログ\n',
          )

          decisions = '''## 対応規模と検索方式

          ### 判断

          実運用で確認された約400,000ノード / 300,000 relationのsnapshotを初期の製品上限へ取り込みます。
          索引付きSQLiteによる検索方式と最大4読み取り接続は継続し、外部グラフDBやsnapshot全体のオンメモリ索引は追加しません。

          ただし、従来の`pathtree`は各候補経路へrootから現在地までのnode ID列とrelation ID列を複製して保持していました。
          高密度グラフでは経路prefixの重複がメモリを支配したため、経路は`previous`参照によるDAGだけを保持し、辞書順比較時だけ短命なscratchへ展開する方式へ変更します。
          全relationが確定済みの場合は、同一になるall-pathとconfirmed-pathの経路集合も共有します。

          代表経路の比較規則は変更しません。
          dependency distance、graph depth、node ID列、relation ID列の順で決定的に比較します。
          メモリ削減のために検索結果や経路情報を切り詰めません。

          ### 根拠

          GitHub Actions（4 CPU、linux/amd64）で100,000ノード / 300,000 relationの同一Medium形状を変更前後に測定しました。

          | 指標 | 変更前 | 変更後 |
          |---|---:|---:|
          | 内部解析p95 | 23.7 s | 25.9 s |
          | `Build` p95 | 19.9 s | 22.4 s |
          | Heap増分 | 5.64 GiB | 約527 MiB |
          | RSS増分 | 6.50 GiB | 約588 MiB |

          CPU時間は約1割増えましたが、検索メモリは約90%減少しました。
          40万ノード / 30万relationのoperational profileでも、全ノードへ到達するtargetを約15.2秒で完遂し、cold RSS増分は約1.56 GiBでした。
          代表targetは公開HTTPの並行度4でp95 12.24 ms以下でした。

          旧10秒deadlineでは受入済み40万ノードsnapshotの最悪targetを正常完了前に失敗させるため、異常時deadlineを60秒へ変更します。
          p95 1秒の性能目標と、受入済みsnapshotを部分成功にしないためのdeadlineは別の契約として扱います。

          ### 容量検査

          ノード400,000、relation 300,000、リミット5,000、SCC 3,000、ジョブネット階層64を取込時の製品上限とします。
          manifestで判定できるノード数とrelation数は大きなNDJSON処理前に拒否し、内容を読む必要があるリミット数・SCC・階層深さは検証工程で拒否します。
          対応規模を超えたsnapshotを有効化して検索時に部分結果へするモードは設けません。

          測定条件と履歴は[性能測定結果](../development/performance-measurement.md#issue-52-実運用40万ノード級の再測定)を正本とします。

          '''
          regex_once(
              'docs/design/decisions.md',
              r'## 対応規模と検索方式\n.*?## MVPの観測方式\n',
              decisions + '## MVPの観測方式\n',
          )

          replace_once(
              'docs/design/api.md',
              '''後続リミット取得は10秒で打ち切ります。\n要求のキャンセルまたは時間上限では蓄積済みの結果を返さず、`analysis-timeout`として終了します。\nこの時間上限は、正常系の性能目標ではなく、異常時に処理と検索世代の保持を終了させる上限です。''',
              '''後続リミット取得は60秒で打ち切ります。\n要求のキャンセルまたは時間上限では蓄積済みの結果を返さず、`analysis-timeout`として終了します。\nこの時間上限は、正常系のp95性能目標ではなく、40万ノード級を含む受入済みsnapshotの完全解析へ余裕を持たせつつ、異常時に処理と検索世代の保持を終了させる上限です。''',
          )

          replace_once(
              'docs/development/testing.md',
              '通常のテストは、初期対応規模の受入境界と軽量な病理グラフを件数の合否に使いますが、実行時間やメモリ量の性能閾値を合否に使いません。',
              '通常のテストは、完全解析のfailure modeを再現できる軽量な回帰境界と病理グラフを使い、実行時間やメモリ量の性能閾値を合否に使いません。40万ノード級の受入境界そのものは`go test -race ./...`へ持ち込まず、専用performance profileで検査します。',
          )
          replace_once(
              'docs/development/testing.md',
              '| Small | 初期対応規模の取込と解析を確認する | Dev ContainerとCI、および現行の性能測定で使用する |\n| Pathological | 規模以外のグラフ形状を確認する | Dev ContainerとCI、および現行の性能測定で使用する |\n| Medium | 初期対応規模を超えた増加傾向を調べる | 過去の性能測定で使用した生成器として保持する |\n| Scale | Mediumより大きい規模の判断材料を作る | 過去の測定設計で使用した生成器として保持する |',
              '| Small | 軽量な回帰規模の取込と解析を確認する | Dev ContainerとCI、および通常の性能測定で使用する |\n| Operational | 400,000ノード / 300,000 relationの現行受入規模と代表・全件到達targetを測る | 通常CIから分離した専用測定で使用する |\n| Pathological | 規模以外のグラフ形状を確認する | Dev ContainerとCI、および現行の性能測定で使用する |\n| Medium | 100,000ノード / 300,000 relationの高密度形状を測る | Issue #52の比較測定と履歴確認に使用する |\n| Scale | 現行受入規模を超える将来候補を識別する | 過去の測定設計で使用した生成器として保持する |',
          )
          replace_once(
              'docs/development/testing.md',
              '| `PERF_RUNS=3 make perf-small` | Smallの取込、二対象のcoldとwarmの静的解析 |',
              '| `PERF_RUNS=3 make perf-small` | Smallの取込、二対象のcoldとwarmの静的解析 |\n| `go run ./cmd/perf-measure -profile operational -runs 2` | 現行受入規模の取込、代表targetと全件到達targetのcold/warm解析 |',
          )
          regex_once(
              'docs/development/testing.md',
              r'Medium、Scale、10,000ノードを超える中間規模の結果は、現在の受入上限を確定する前に行った測定履歴です。\n現行の製品validationは受入上限を超える入力を拒否するため、それらを現行の取込経路で測定するコマンドは標準入口として提供しません。\n過去の測定条件と結果は\[性能測定結果\]\(performance-measurement.md\)に記録します。\n対応規模を見直す場合は、候補上限を測定できる再現可能な専用手順を先に用意し、製品validationを一時的に弱めて測定しません。',
              'OperationalとMediumは通常のrace suiteへ含めず、対応規模やアルゴリズム変更時だけ専用コマンドで測定します。Scaleは現行受入規模を超える履歴用generatorであり、製品validationを迂回して標準測定しません。\n過去と現在の測定条件・結果は[性能測定結果](performance-measurement.md)に記録します。\n対応規模を見直す場合は、候補上限を再現する専用profileを先に用意し、通常テストや製品validationを一時的に弱めて測定しません。',
          )

          perf = Path('docs/development/performance-measurement.md')
          perf_text = perf.read_text()
          marker = '## Issue #52: 実運用40万ノード級の再測定'
          if marker in perf_text:
              raise SystemExit('performance section already exists')
          perf_text += '''\n\n## Issue #52: 実運用40万ノード級の再測定\n\nIssue #52では、実運用で確認された約400,000ノード / 300,000 relationを現行の受入規模へ取り込むため、GitHub Actions上で再測定しました。\n過去のApple arm64環境での測定値は履歴として上節へ残し、この節の値と混在させません。\n\n### 測定環境とコマンド\n\n- OS: Ubuntu 24.04 / linux amd64\n- Go: 1.26.5\n- CPU: 4 vCPU、`GOMAXPROCS=4`\n- operational測定commit: `dda3a127ae67bcf5d81207045fd1c7caa8e41dca`\n\n```bash\ngo run ./cmd/perf-measure -profile operational -runs 2\n\ngo run ./cmd/perf-measure \\\n  -mode limit-analysis \\\n  -profile operational \\\n  -runs 2 \\\n  -concurrencies 1,4\n```\n\n`operational`は400,000ノード、300,000 relation、5,000リミット、4,000 job networkを生成します。\n同一snapshotに、約100ノードだけへ到達する代表target `OPS-NET-0000`と、全400,000ノードへ到達する`OPS-ROOT`を持ちます。\nアーカイブは3,617,541 bytes、SHA-256は`43a9b9062351aeb08be43cf2b273900311dc14fab5328668ec5a64f4c0a28dfa`です。\n\n### 取込\n\n2反復のp95または最大値は次のとおりです。\n\n| 指標 | 値 |\n|---|---:|\n| 取込全体 p95 | 48.262 s |\n| 展開 p95 | 8.925 s |\n| 検査 p95 | 14.553 s |\n| SQLite登録 p95 | 16.505 s |\n| 完了処理 p95 | 8.634 s |\n| Heap増分 最大 | 285,113,960 bytes（約272 MiB） |\n| RSS増分 最大 | 293,732,352 bytes（約280 MiB） |\n| 一時ディスク 最大 | 182,442,185 bytes（約174 MiB） |\n| SQLite | 154,230,784 bytes（約147 MiB） |\n\n### operational profileの静的解析\n\n| target | 到達node | relation | tree node | limit | `Traverse` p95 | `Scan` p95 | `Build` p95 | 全体 p95 | cold RSS増分 p95 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| `OPS-NET-0000` | 100 | 98 | 198 | 99 | 1.46 ms | 0.86 ms | 0.54 ms | 2.93 ms | 0.57 MiB |\n| `OPS-ROOT` | 400,000 | 300,000 | 700,000 | 5,000 | 6.39 s | 0.96 s | 7.80 s | 15.12 s | 約1.56 GiB |\n\n`OPS-ROOT`では95,949件の`uncoveredRoutes`も欠落なく返しました。\n正常処理を件数で打ち切る上限は追加していません。\n\n### 公開HTTPの代表target\n\n`OPS-NET-0000`を製品の`http.Handler`で測定しました。\nDTO組立て、JSON化、構造化ログ、`httptest.ResponseRecorder`への書込みを含みます。\n\n| 並行度 | 状態 | p95 |\n|---:|---|---:|\n| 1 | cold | 4.26 ms |\n| 1 | warm | 3.62 ms |\n| 4 | cold | 12.24 ms |\n| 4 | warm | 10.51 ms |\n\n同じ入力・条件の応答digestは一致し、決定性を維持しました。\n\n### `pathtree`メモリ削減の比較\n\n400k対応の上限定数だけを変更した状態で、100,000ノード / 300,000 relationのMedium形状を再測定すると、検索中RSS増分が約6.50 GiBに達しました。\n主因は、`pathtree`が各候補経路へrootからのnode ID列とrelation ID列を重複保持していたことです。\n\n経路を`previous`参照のDAGとして保持し、辞書順比較時だけscratchへ展開する方式へ変更した後の同一形状は次のとおりです。\n\n| 指標 | 変更前 | 変更後 |\n|---|---:|---:|\n| 内部解析 p95 | 23.72 s | 25.94 s |\n| `Build` p95 | 19.88 s | 22.35 s |\n| Heap増分 p95 | 約5.64 GiB | 約527 MiB |\n| RSS増分 p95 | 約6.50 GiB | 約588 MiB |\n\nCPU時間は約1割増えましたが、Heap/RSSを約90%削減しました。\n検索結果、代表経路規則、リミット、`uncoveredRoutes`は切り詰めていません。\n\n### 判定\n\n400,000ノード / 300,000 relationを取込時の対応規模へ引き上げます。\n代表targetは並行度4でもp95 1秒目標へ十分な余力があります。\n一方、snapshot全体へ到達する最悪targetや高密度relation形状を1秒以内に処理することは性能目標に含めず、完全解析を優先します。\n旧10秒deadlineでは測定済みの正常な全件解析を途中で失敗させるため、異常時deadlineを60秒へ変更します。\n\nOperational、Mediumのような大規模profileは通常の`make verify`へ含めません。\n通常suiteでは同じfailure modeを小さいfixtureで検査し、対応規模の実測はこの専用手順で再現します。\n'''
          perf.write_text(perf_text)

          # Keep the 2026-08-11 HTTP report as historical evidence, then append current operational evidence.
          replace_once(
              'docs/development/limit-analysis-performance.md',
              'Smallは受入上限と同じ10,000ノード、25,000 relationです。',
              'Smallは2026-08-11時点の受入上限と同じ10,000ノード、25,000 relationです。',
          )
          replace_once(
              'docs/development/limit-analysis-performance.md',
              'Mediumは100,000ノード、300,000 relationであり、現在の受入上限である10,000ノード、25,000 relationを超えます。',
              'Mediumは100,000ノード、300,000 relationであり、この測定を行った2026-08-11時点の受入上限10,000ノード、25,000 relationを超えていました。',
          )
          replace_once(
              'docs/development/limit-analysis-performance.md',
              '受入上限と同じSmallのwarmかつ並行度4のp95は753.289 msであり、目標を満たしました。',
              '当時の受入上限と同じSmallのwarmかつ並行度4のp95は753.289 msであり、目標を満たしました。',
          )
          replace_once(
              'docs/development/limit-analysis-performance.md',
              'Mediumは受入上限外のため、公開HTTPの分布を取得していません。',
              'Mediumはこの測定時点では受入上限外だったため、当時の公開HTTP分布を取得していません。Issue #52で対応規模を更新した後の結果は[取込と静的解析の性能測定結果](performance-measurement.md#issue-52-実運用40万ノード級の再測定)を参照してください。',
          )
          limit_perf = Path('docs/development/limit-analysis-performance.md')
          limit_text = limit_perf.read_text()
          if '## Issue #52のoperational profile' not in limit_text:
              limit_text += '''\n\n## Issue #52のoperational profile\n\n2026-08-12に、400,000ノード / 300,000 relationのoperational profileで公開HTTPを再測定しました。\n環境はGitHub ActionsのUbuntu 24.04、linux/amd64、Go 1.26.5、4 CPUです。\n代表target `OPS-NET-0000`は100ノードへ到達し、99リミット、198 tree nodeを返します。\n並行度4のp95はcold 12.24 ms、warm 10.51 msで、p95 1秒の代表負荷目標を満たしました。\n\n40万ノード全体へ到達する`OPS-ROOT`は、内部`Traverse -> Scan -> Build`のp95が15.12秒でした。\nこれは完全解析保証のstress caseであり、1秒以内に切り捨てる対象にはしません。\n詳細な取込、メモリ、段階別測定は[Issue #52の再測定](performance-measurement.md#issue-52-実運用40万ノード級の再測定)を参照してください。\n'''
          limit_perf.write_text(limit_text)
          PY
          gofmt -w internal/pathtree/pathtree.go
          go test ./internal/pathtree ./internal/snapshot ./internal/app
          git diff --check
      - name: Commit finalized changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/pathtree/pathtree.go docs/operations.md docs/design/decisions.md docs/design/api.md docs/development/testing.md docs/development/performance-measurement.md docs/development/limit-analysis-performance.md
          git commit -m "docs: record 400k scale support and measurements [issue52-finalize]"
          git push origin HEAD:feature/support-400k-snapshots
