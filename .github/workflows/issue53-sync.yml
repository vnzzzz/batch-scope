name: Issue 53 sync

on:
  push:
    branches:
      - agent/issue-53-namespaces

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue53-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/issue-53-namespaces
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Sync reserved namespace documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/design/canonical-snapshot.md': (
                  'schema version 0.5では既存スナップショットとの互換性を維持します。`namespace`と`localId`を持たない従来ノードは、その`id`をそのままcanonical IDとして受け入れ、API表示上はnamespace=`default`、localId=`id`として扱います。新しく複数namespaceを生成する変換では、この従来形式へ依存せず`namespace`と`localId`を明示します。',
                  'schema version 0.5では既存スナップショットとの互換性を維持します。`namespace`と`localId`を持たない従来ノードは、その`id`をそのままcanonical IDとして受け入れ、API表示上はnamespace=`default`、localId=`id`として扱います。`default`はこの互換表示専用に予約し、新しいnamespace対応ノードへ明示指定してはいけません。新しく複数namespaceを生成する変換では、この従来形式へ依存せず`namespace`と`localId`を明示します。',
              ),
              'skills/public/batchscope/references/canonical-snapshot.md': (
                  'schema version 0.5の従来データは`namespace`と`localId`を省略できる。その場合、API表示上はnamespace=`default`、localId=`id`として扱われる。複数namespaceを新しく生成するときは従来形式へ依存しない。',
                  'schema version 0.5の従来データは`namespace`と`localId`を省略できる。その場合、API表示上はnamespace=`default`、localId=`id`として扱われる。`default`はこの互換表示専用の予約namespaceであり、新しいnamespace対応ノードへ明示指定しない。複数namespaceを新しく生成するときは従来形式へ依存しない。',
              ),
              'skills/public/batchscope/SKILL.md': (
                  '2. **意味上の定義セットをnamespaceとして特定する。** 本番/DR、独立した環境、管理上別の定義領域などが該当する。ファイルの分割単位だけをnamespaceにしない。資料から判断できない場合は推測しない。',
                  '2. **意味上の定義セットをnamespaceとして特定する。** 本番/DR、独立した環境、管理上別の定義領域などが該当する。ファイルの分割単位だけをnamespaceにしない。資料から判断できない場合は推測しない。`default`は従来snapshotの互換表示専用なので、新しいnamespaceとして割り当てない。',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: target paragraph did not match exactly once')
              path.write_text(text.replace(old, new))
          PY
      - name: Verify
        run: make verify
      - name: Commit docs and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue53-sync.yml
          git add docs/design/canonical-snapshot.md skills/public/batchscope/SKILL.md skills/public/batchscope/references/canonical-snapshot.md
          git commit -m 'docs: namespace互換境界を確定する [issue53-sync]'
          git push origin HEAD:agent/issue-53-namespaces
