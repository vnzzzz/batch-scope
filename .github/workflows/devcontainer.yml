name: Dev Container

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dev Containers CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Create Dev Container
        run: devcontainer up --workspace-folder .

      - name: Verify development tools
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            set -Eeuo pipefail
            go version
            sqlite3 --version
            codex --version
            claude --version
            gh --version | head -n 1
            test -n "${CODEX_HOME:-}"
            test -n "${CLAUDE_CONFIG_DIR:-}"
            test -n "${GH_CONFIG_DIR:-}"
          '

      - name: Verify repository
        run: devcontainer exec --workspace-folder . make verify

      - name: Verify committed lockfile
        run: git diff --exit-code -- .devcontainer/devcontainer-lock.json
