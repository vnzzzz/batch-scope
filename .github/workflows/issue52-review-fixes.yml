name: Issue 52 review fixes

on:
  push:
    branches:
      - feature/support-400k-snapshots

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[issue52-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/support-400k-snapshots
          persist-credentials: true
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python3 scripts/issue52-review-fixes.py
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations.md docs/development/performance-measurement.md docs/development/limit-analysis-performance.md
          git commit -m "docs: address issue52 self-review findings [issue52-review-fix]"
          git push origin HEAD:feature/support-400k-snapshots
